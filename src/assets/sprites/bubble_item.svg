<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bubble_grad" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#B3E5FC" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#81D4FA" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="bubble_rim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#7EC8E3" stop-opacity="0.7"/>
    </radialGradient>
  </defs>
  <!-- Main bubble -->
  <circle cx="64" cy="64" r="46" fill="url(#bubble_grad)" stroke="#7EC8E3" stroke-width="2.5" stroke-opacity="0.8"/>
  <!-- Inner shimmer rim -->
  <circle cx="64" cy="64" r="46" fill="url(#bubble_rim)"/>
  <!-- Highlight top-left -->
  <ellipse cx="48" cy="44" rx="12" ry="8" fill="white" fill-opacity="0.7" transform="rotate(-30,48,44)"/>
  <!-- Small secondary highlight -->
  <ellipse cx="54" cy="34" rx="5" ry="3" fill="white" fill-opacity="0.5"/>
  <!-- Subtle color tint bands -->
  <path d="M30 80 Q64 105 98 80" fill="none" stroke="#7EC8E3" stroke-width="1" stroke-opacity="0.4"/>
  <path d="M25 64 Q64 88 103 64" fill="none" stroke="#B3E5FC" stroke-width="1" stroke-opacity="0.3"/>
</svg>
