<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="shield_grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E3F2FD" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#42A5F5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1565C0" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="shield_glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#42A5F5" stop-opacity="0"/>
    </radialGradient>
    <filter id="shield_blur">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Outer glow ring -->
  <circle cx="64" cy="64" r="56" fill="#42A5F5" fill-opacity="0.15" filter="url(#shield_blur)"/>
  <!-- Shield outer ring -->
  <circle cx="64" cy="64" r="50" fill="url(#shield_grad)" stroke="#42A5F5" stroke-width="3" stroke-opacity="0.8"/>
  <!-- Shimmer bands -->
  <path d="M20 64 Q64 94 108 64" fill="none" stroke="#90CAF9" stroke-width="2" stroke-opacity="0.5"/>
  <path d="M26 50 Q64 78 102 50" fill="none" stroke="#64B5F6" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Top highlight -->
  <ellipse cx="50" cy="38" rx="18" ry="10" fill="url(#shield_glow)" transform="rotate(-20,50,38)"/>
  <!-- Inner bubble icon -->
  <circle cx="64" cy="64" r="24" fill="#E3F2FD" fill-opacity="0.4" stroke="#42A5F5" stroke-width="2"/>
  <!-- Bubble highlight inside -->
  <ellipse cx="56" cy="54" rx="10" ry="6" fill="white" fill-opacity="0.6" transform="rotate(-20,56,54)"/>
  <!-- Star sparkles -->
  <circle cx="32" cy="30" r="3.5" fill="#64B5F6" fill-opacity="0.9"/>
  <circle cx="96" cy="28" r="3" fill="#90CAF9" fill-opacity="0.9"/>
  <circle cx="102" cy="96" r="4" fill="#42A5F5" fill-opacity="0.8"/>
  <circle cx="26" cy="94" r="3" fill="#64B5F6" fill-opacity="0.8"/>
  <!-- Small bubble accents -->
  <circle cx="18" cy="64" r="5" fill="none" stroke="#90CAF9" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="110" cy="64" r="4" fill="none" stroke="#90CAF9" stroke-width="1.5" stroke-opacity="0.7"/>
</svg>
