<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="crystal_grad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#A8EDEA"/>
      <stop offset="50%" stop-color="#29B6C8"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
    <filter id="glow_crystal">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Glow aura -->
  <circle cx="64" cy="64" r="50" fill="#00BCD4" fill-opacity="0.15"/>
  <!-- Crystal main body: hexagonal prism top view -->
  <polygon points="64,10 98,32 98,80 64,102 30,80 30,32" fill="url(#crystal_grad)" stroke="#00838F" stroke-width="2.5" filter="url(#glow_crystal)"/>
  <!-- Inner face highlight -->
  <polygon points="64,22 86,38 86,76 64,92 42,76 42,38" fill="#A8EDEA" fill-opacity="0.35"/>
  <!-- Top face -->
  <polygon points="64,10 86,38 42,38" fill="#E0FFFF" fill-opacity="0.6"/>
  <!-- Facet lines -->
  <line x1="64" y1="10" x2="64" y2="102" stroke="white" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="42" y1="38" x2="86" y2="38" stroke="white" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Sparkle -->
  <circle cx="52" cy="30" r="4" fill="white" fill-opacity="0.8"/>
  <circle cx="76" cy="24" r="2.5" fill="white" fill-opacity="0.6"/>
</svg>
