<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="body_g_fall" cx="45%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#FFF176"/>
      <stop offset="60%" stop-color="#FFE135"/>
      <stop offset="100%" stop-color="#F9C906"/>
    </radialGradient>
  </defs>
  <!-- Character tilted ~15 deg downward -->
  <g transform="rotate(15, 64, 70)">
    <!-- Ahoge (drooping) -->
    <path d="M66 30 Q72 18 76 14 Q64 16 62 8 Q59 15 54 14 Q58 20 66 30Z" fill="#FFE135" stroke="#222" stroke-width="2"/>
    <!-- Body -->
    <ellipse cx="64" cy="74" rx="32" ry="38" fill="url(#body_g_fall)" stroke="#222" stroke-width="3"/>
    <!-- Belly curve -->
    <path d="M50 84 Q64 94 78 84" fill="none" stroke="#F9C906" stroke-width="2" stroke-linecap="round"/>
    <!-- Wings pulled in / drooping -->
    <ellipse cx="30" cy="84" rx="10" ry="6" fill="#FFE135" stroke="#222" stroke-width="2" transform="rotate(20,30,84)"/>
    <ellipse cx="98" cy="84" rx="10" ry="6" fill="#FFE135" stroke="#222" stroke-width="2" transform="rotate(-20,98,84)"/>
    <!-- Worried eyes (angled inward, slightly wider) -->
    <ellipse cx="53" cy="65" rx="8" ry="10" fill="#111"/>
    <circle cx="50" cy="62" r="2.5" fill="white"/>
    <!-- Worried eyebrow left -->
    <path d="M46 57 Q52 60 57 56" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="75" cy="65" rx="8" ry="10" fill="#111"/>
    <circle cx="72" cy="62" r="2.5" fill="white"/>
    <!-- Worried eyebrow right -->
    <path d="M71 56 Q76 60 82 57" fill="none" stroke="#111" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Worried mouth (slight frown) -->
    <path d="M56 80 Q64 76 72 80" fill="none" stroke="#222" stroke-width="2" stroke-linecap="round"/>
    <!-- Beak -->
    <ellipse cx="64" cy="77" rx="6" ry="4" fill="#FF8C00" stroke="#222" stroke-width="1.5"/>
    <!-- Feet -->
    <ellipse cx="53" cy="112" rx="9" ry="5" fill="#FF8C00" stroke="#222" stroke-width="1.5"/>
    <ellipse cx="75" cy="112" rx="9" ry="5" fill="#FF8C00" stroke="#222" stroke-width="1.5"/>
  </g>
</svg>
